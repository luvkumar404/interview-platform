name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: npm run lint
          - name: Type check
            command: npx --no-install next typegen && npx --no-install tsc --noEmit
          - name: Unit tests
            command: npx --no-install tsx --test scripts/test-webrtc-session.ts
          - name: Build
            command: npm run build

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # The postinstall script generates the Prisma client.
        run: npm ci

      - name: ${{ matrix.name }}
        # DATABASE_URL is optional; the app supports local fallback storage.
        run: ${{ matrix.command }}
